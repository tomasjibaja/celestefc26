<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mañana — Lyric Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" id="stage">

  <!-- ============ FONDO ANIMADO (SVG) ============ -->
  <svg id="sky" class="sky" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
        <stop id="skyStop1" offset="0%"  stop-color="#1b2140"/>
        <stop id="skyStop2" offset="55%" stop-color="#3a3d6b"/>
        <stop id="skyStop3" offset="100%" stop-color="#e8b98a"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff3d6" stop-opacity="0.95"/>
        <stop offset="45%" stop-color="#ffd58a" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#ffd58a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="seaGradient" x1="0" y1="0" x2="0" y2="1">
        <stop id="seaStop1" offset="0%" stop-color="#2b3a5c"/>
        <stop id="seaStop2" offset="100%" stop-color="#101528"/>
      </linearGradient>
      <linearGradient id="hillGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#26304f"/>
        <stop offset="100%" stop-color="#151a30"/>
      </linearGradient>
    </defs>

    <!-- cielo -->
    <rect x="0" y="0" width="1000" height="600" fill="url(#skyGradient)"/>

    <!-- estrellas (aparecen de noche) -->
    <g id="stars" class="stars"></g>

    <!-- resplandor del sol -->
    <circle id="sunGlowCircle" cx="500" cy="620" r="220" fill="url(#sunGlow)"/>

    <!-- sol -->
    <circle id="sun" cx="500" cy="620" r="46" fill="#fff2cf"/>

    <!-- nubes -->
    <g id="clouds" class="clouds">
      <g class="cloud cloud-a" transform="translate(120,140)">
        <path d="M0 20 Q -10 -6 20 0 Q 28 -22 55 -8 Q 80 -18 92 4 Q 118 0 112 24 Q 128 40 100 46 L 10 46 Q -14 42 0 20 Z" fill="#fdf3ea" opacity="0.85"/>
      </g>
      <g class="cloud cloud-b" transform="translate(680,90)">
        <path d="M0 16 Q -8 -4 16 -2 Q 22 -18 44 -6 Q 64 -14 74 4 Q 96 0 90 20 Q 104 32 82 36 L 8 36 Q -10 32 0 16 Z" fill="#fdf3ea" opacity="0.8"/>
      </g>
      <g class="cloud cloud-c" transform="translate(340,60)">
        <path d="M0 14 Q -6 -3 14 -2 Q 19 -15 38 -5 Q 55 -12 63 3 Q 82 0 77 17 Q 89 27 70 31 L 7 31 Q -8 27 0 14 Z" fill="#fdf3ea" opacity="0.7"/>
      </g>
    </g>

    <!-- pájaros -->
    <g id="birds" class="birds">
      <g class="bird bird-1">
        <path class="bird-wing-l" d="M0,0 C-7,-1 -13,-7 -19,-6 C-13,-3 -9,1 0,0Z"/>
        <path class="bird-wing-r" d="M0,0 C7,-1 13,-7 19,-6 C13,-3 9,1 0,0Z"/>
      </g>
      <g class="bird bird-2">
        <path class="bird-wing-l" d="M0,0 C-7,-1 -13,-7 -19,-6 C-13,-3 -9,1 0,0Z"/>
        <path class="bird-wing-r" d="M0,0 C7,-1 13,-7 19,-6 C13,-3 9,1 0,0Z"/>
      </g>
      <g class="bird bird-3">
        <path class="bird-wing-l" d="M0,0 C-7,-1 -13,-7 -19,-6 C-13,-3 -9,1 0,0Z"/>
        <path class="bird-wing-r" d="M0,0 C7,-1 13,-7 19,-6 C13,-3 9,1 0,0Z"/>
      </g>
      <g class="bird bird-4">
        <path class="bird-wing-l" d="M0,0 C-7,-1 -13,-7 -19,-6 C-13,-3 -9,1 0,0Z"/>
        <path class="bird-wing-r" d="M0,0 C7,-1 13,-7 19,-6 C13,-3 9,1 0,0Z"/>
      </g>
    </g>

    <!-- horizonte / colinas -->
    <path class="hills" d="M0,430 Q150,380 320,410 T640,400 T1000,420 L1000,600 L0,600 Z" fill="url(#hillGradient)"/>

    <!-- mar -->
    <rect x="0" y="430" width="1000" height="170" fill="url(#seaGradient)" opacity="0.55"/>
    <path class="sea-line" d="M0,432 Q250,424 500,432 T1000,430" stroke="#fdf3ea" stroke-opacity="0.25" stroke-width="2" fill="none"/>

    <!-- barco / container marítimo (aparece ~seg 92) -->
    <defs>
      <filter id="shipReflectionBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.1"/>
      </filter>
      <linearGradient id="hullShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2c3454"/>
        <stop offset="100%" stop-color="#181c30"/>
      </linearGradient>
    </defs>
    <g id="ship" class="ship" transform="translate(-160,452)">

      <!-- reflejo sobre el agua -->
      <g class="ship-reflection" filter="url(#shipReflectionBlur)" transform="scale(1,-1) translate(0,-4)">
        <path d="M-4,4 L4,26 L118,26 L134,14 L120,4 Z" fill="#12162a"/>
        <rect x="10" y="-16" width="16" height="20" fill="#c0563f"/>
        <rect x="28" y="-16" width="16" height="20" fill="#3f7f9c"/>
        <rect x="46" y="-30" width="16" height="34" fill="#dfae5a"/>
        <rect x="64" y="-16" width="16" height="20" fill="#b5765f"/>
        <rect x="82" y="-30" width="16" height="34" fill="#3f7f9c"/>
        <rect x="100" y="-16" width="16" height="20" fill="#c0563f"/>
      </g>

      <!-- estela suave -->
      <path class="ship-wake" d="M-18,20 Q-40,16 -60,20 M-14,25 Q-34,23 -52,26" fill="none" stroke="#fdf3ea" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>

      <!-- casco -->
      <path d="M-4,14 L4,4 L120,4 L134,14 L120,26 L4,26 Z" fill="url(#hullShade)" stroke="#0e1120" stroke-width="1"/>
      <path d="M4,6 L120,6" stroke="#4a5178" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
      <line x1="14" y1="26" x2="14" y2="30" stroke="#0e1120" stroke-width="2"/>
      <line x1="60" y1="26" x2="60" y2="30" stroke="#0e1120" stroke-width="2"/>
      <line x1="104" y1="26" x2="104" y2="30" stroke="#0e1120" stroke-width="2"/>

      <!-- contenedores (con leve volumen) -->
      <g class="containers">
        <rect x="10" y="-16" width="16" height="20" rx="1" fill="#c0563f"/>
        <rect x="10" y="-16" width="16" height="4" fill="#e08268" opacity="0.7"/>
        <rect x="28" y="-16" width="16" height="20" rx="1" fill="#3f7f9c"/>
        <rect x="28" y="-16" width="16" height="4" fill="#6fa8c2" opacity="0.7"/>
        <rect x="46" y="-30" width="16" height="34" rx="1" fill="#dfae5a"/>
        <rect x="46" y="-30" width="16" height="4" fill="#f0cd8c" opacity="0.7"/>
        <rect x="64" y="-16" width="16" height="20" rx="1" fill="#b5765f"/>
        <rect x="64" y="-16" width="16" height="4" fill="#d6a08c" opacity="0.7"/>
        <rect x="82" y="-30" width="16" height="34" rx="1" fill="#3f7f9c"/>
        <rect x="82" y="-30" width="16" height="4" fill="#6fa8c2" opacity="0.7"/>
        <rect x="100" y="-16" width="16" height="20" rx="1" fill="#c0563f"/>
        <rect x="100" y="-16" width="16" height="4" fill="#e08268" opacity="0.7"/>
      </g>

      <!-- puente de mando -->
      <g class="bridge">
        <rect x="-2" y="-26" width="16" height="30" rx="1.5" fill="#e9ddc8"/>
        <rect x="0" y="-22" width="4" height="4" fill="#2a3350"/>
        <rect x="6" y="-22" width="4" height="4" fill="#2a3350"/>
        <rect x="0" y="-15" width="10" height="3" fill="#2a3350" opacity="0.5"/>
        <line x1="6" y1="-26" x2="6" y2="-38" stroke="#2a3350" stroke-width="1.4"/>
        <line x1="6" y1="-38" x2="12" y2="-38" stroke="#2a3350" stroke-width="1.4"/>
        <rect x="-6" y="-14" width="6" height="18" fill="#20263f"/>
      </g>

      <!-- chimenea con humo -->
      <g class="funnel">
        <path d="M-4,-14 L-3,-24 Q-3,-27 1,-27 L2,-27 Q6,-27 6,-24 L7,-14 Z" fill="#2a3350"/>
        <rect x="-3" y="-25" width="10" height="2.4" fill="#c0563f"/>
        <path class="smoke smoke-1" d="M2,-27 Q6,-33 2,-38 Q-2,-42 2,-47" fill="none" stroke="#fdf3ea" stroke-width="2.4" stroke-linecap="round" opacity="0.28"/>
        <path class="smoke smoke-2" d="M2,-27 Q7,-32 4,-37 Q0,-41 4,-45" fill="none" stroke="#fdf3ea" stroke-width="1.8" stroke-linecap="round" opacity="0.2"/>
      </g>
    </g>

    <!-- vegetación en primer plano -->
    <g class="foliage" fill="#141a2e">
      <path d="M-20,600 C10,520 40,560 60,600 Z"/>
      <path d="M40,600 C60,540 95,560 110,600 Z"/>
      <path d="M900,600 C930,530 960,560 985,600 Z"/>
      <path d="M840,600 C865,555 900,565 920,600 Z"/>
    </g>

    <!-- viñeta suave -->
    <rect x="0" y="0" width="1000" height="600" fill="url(#sunGlow)" opacity="0"/>
  </svg>

  <!-- partículas atmosféricas -->
  <div class="particles" id="particles"></div>

  <!-- ============ LETRA ============ -->
  <div class="lyrics-wrap">
    <svg class="lyrics-underline" viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true">
      <path id="lyricsInk" d="M10,10 Q200,4 390,10" fill="none" stroke="#ffe3b0" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p id="lyricLine" class="lyric-line" aria-live="polite"></p>
  </div>

  <!-- ============ CONTROLES ============ -->
  <div class="player" id="player">
    <div class="progress-row">
      <span class="time" id="timeCurrent">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-handle" id="progressHandle"></div>
      </div>
      <span class="time" id="timeTotal">0:00</span>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn loop-btn" id="loopBtn" title="Repetir" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M17 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11V9a4 4 0 0 1 4-4h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 22l-4-4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13v2a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="ctrl-btn play-btn" id="playBtn" title="Reproducir" aria-label="Reproducir">
        <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" width="22" height="22" style="display:none"><rect x="6" y="4.5" width="4.5" height="15" fill="currentColor"/><rect x="13.5" y="4.5" width="4.5" height="15" fill="currentColor"/></svg>
      </button>

      <div class="ctrl-spacer" aria-hidden="true"></div>
    </div>
  </div>

  <!-- ============ PANTALLA FINAL ============ -->
  <div class="final-screen" id="finalScreen">
    <div class="final-inner">
      <p class="final-question" id="finalQuestion">Ayudanos a mejorar</p>
      <div class="rating-row" id="ratingRow">
        <button class="rate-btn" data-rate="dislike">
          <span class="rate-icon">👎</span>
          <span class="rate-label">Goma</span>
        </button>
        <button class="rate-btn" data-rate="like">
          <span class="rate-icon">🤍</span>
          <span class="rate-label">Zafa</span>
        </button>
        <button class="rate-btn" data-rate="love">
          <span class="rate-icon">❤️</span>
          <span class="rate-label">Amé</span>
        </button>
      </div>
      <p class="final-thanks" id="finalThanks">Gracias por escuchar.</p>
      <button class="replay-btn" id="replayBtn">Volver a escuchar</button>
    </div>
  </div>

  <audio id="audio" src="audio/cancion.mp3" preload="metadata"></audio>
</div>

<script src="script.js"></script>
</body>
</html>
