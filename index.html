<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mañana — Lyric Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" id="stage">

  <!-- ============ FONDO ANIMADO (SVG) ============ -->
  <svg id="sky" class="sky" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
        <stop id="skyStop1" offset="0%"  stop-color="#1b2140"/>
        <stop id="skyStop2" offset="55%" stop-color="#3a3d6b"/>
        <stop id="skyStop3" offset="100%" stop-color="#e8b98a"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff3d6" stop-opacity="0.95"/>
        <stop offset="45%" stop-color="#ffd58a" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#ffd58a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="seaGradient" x1="0" y1="0" x2="0" y2="1">
        <stop id="seaStop1" offset="0%" stop-color="#2b3a5c"/>
        <stop id="seaStop2" offset="100%" stop-color="#101528"/>
      </linearGradient>
      <linearGradient id="hillGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#26304f"/>
        <stop offset="100%" stop-color="#151a30"/>
      </linearGradient>
    </defs>

    <!-- cielo -->
    <rect x="0" y="0" width="1000" height="600" fill="url(#skyGradient)"/>

    <!-- estrellas (aparecen de noche) -->
    <g id="stars" class="stars"></g>

    <!-- resplandor del sol -->
    <circle id="sunGlowCircle" cx="500" cy="620" r="220" fill="url(#sunGlow)"/>

    <!-- sol -->
    <circle id="sun" cx="500" cy="620" r="46" fill="#fff2cf"/>

    <!-- nubes -->
    <g id="clouds" class="clouds">
      <g class="cloud cloud-a" transform="translate(120,140)">
        <path d="M0 20 Q -10 -6 20 0 Q 28 -22 55 -8 Q 80 -18 92 4 Q 118 0 112 24 Q 128 40 100 46 L 10 46 Q -14 42 0 20 Z" fill="#fdf3ea" opacity="0.85"/>
      </g>
      <g class="cloud cloud-b" transform="translate(680,90)">
        <path d="M0 16 Q -8 -4 16 -2 Q 22 -18 44 -6 Q 64 -14 74 4 Q 96 0 90 20 Q 104 32 82 36 L 8 36 Q -10 32 0 16 Z" fill="#fdf3ea" opacity="0.8"/>
      </g>
      <g class="cloud cloud-c" transform="translate(340,60)">
        <path d="M0 14 Q -6 -3 14 -2 Q 19 -15 38 -5 Q 55 -12 63 3 Q 82 0 77 17 Q 89 27 70 31 L 7 31 Q -8 27 0 14 Z" fill="#fdf3ea" opacity="0.7"/>
      </g>
    </g>

    <!-- pájaros -->
    <g id="birds" class="birds">
      <g class="bird bird-1">
        <path class="bird-wing-l" d="M0,0 C-7,-1 -13,-7 -19,-6 C-13,-3 -9,1 0,0Z"/>
        <path class="bird-wing-r" d="M0,0 C7,-1 13,-7 19,-6 C13,-3 9,1 0,0Z"/>
      </g>
      <g class="bird bird-2">
        <path class="bird-wing-l" d="M0,0 C-7,-1 -13,-7 -19,-6 C-13,-3 -9,1 0,0Z"/>
        <path class="bird-wing-r" d="M0,0 C7,-1 13,-7 19,-6 C13,-3 9,1 0,0Z"/>
      </g>
      <g class="bird bird-3">
        <path class="bird-wing-l" d="M0,0 C-7,-1 -13,-7 -19,-6 C-13,-3 -9,1 0,0Z"/>
        <path class="bird-wing-r" d="M0,0 C7,-1 13,-7 19,-6 C13,-3 9,1 0,0Z"/>
      </g>
      <g class="bird bird-4">
        <path class="bird-wing-l" d="M0,0 C-7,-1 -13,-7 -19,-6 C-13,-3 -9,1 0,0Z"/>
        <path class="bird-wing-r" d="M0,0 C7,-1 13,-7 19,-6 C13,-3 9,1 0,0Z"/>
      </g>
    </g>

    <!-- horizonte / colinas -->
    <path class="hills" d="M0,430 Q150,380 320,410 T640,400 T1000,420 L1000,600 L0,600 Z" fill="url(#hillGradient)"/>

    <!-- mar -->
    <rect x="0" y="430" width="1000" height="170" fill="url(#seaGradient)" opacity="0.55"/>
    <path class="sea-line" d="M0,432 Q250,424 500,432 T1000,430" stroke="#fdf3ea" stroke-opacity="0.25" stroke-width="2" fill="none"/>

    <!-- barco / container marítimo (aparece ~seg 92) -->
    <defs>
      <filter id="shipReflectionBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.1"/>
      </filter>
      <linearGradient id="hullShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#323a5e"/>
        <stop offset="55%" stop-color="#232a47"/>
        <stop offset="100%" stop-color="#141830"/>
      </linearGradient>
      <linearGradient id="bulwarkShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a3150"/>
        <stop offset="100%" stop-color="#1c2140"/>
      </linearGradient>
    </defs>
    <g id="ship" class="ship" transform="translate(-170,452)">

      <!-- reflejo sobre el agua -->
      <g class="ship-reflection" filter="url(#shipReflectionBlur)" transform="scale(1,-1) translate(0,-6)">
        <path d="M-8,10 L-8,20 L2,26 L118,26 L131,20 L131,10 L118,4 L2,4 Z" fill="#12162a"/>
        <rect x="12" y="-8" width="14" height="12" fill="#c0563f"/>
        <rect x="30" y="-8" width="14" height="12" fill="#3f7f9c"/>
        <rect x="48" y="-14" width="14" height="18" fill="#dfae5a"/>
        <rect x="66" y="-8" width="14" height="12" fill="#b5765f"/>
        <rect x="84" y="-14" width="14" height="18" fill="#3f7f9c"/>
        <rect x="102" y="-8" width="14" height="12" fill="#c0563f"/>
      </g>

      <!-- estela suave -->
      <path class="ship-wake" d="M-22,20 Q-44,16 -66,20 M-18,25 Q-38,23 -56,26" fill="none" stroke="#fdf3ea" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>

      <!-- casco: proa recta con leve amurada, popa achatada -->
      <path d="M-8,10 L-8,20 L2,26 L118,26 L131,20 L131,10 L118,4 L2,4 Z"
            fill="url(#hullShade)" stroke="#0d1022" stroke-width="1"/>
      <!-- línea de flotación -->
      <path d="M-8,20 L131,20" stroke="#0d1022" stroke-width="1.2" opacity="0.55"/>
      <!-- ojos de buey -->
      <g class="portholes" fill="none" stroke="#6b7396" stroke-width="1" opacity="0.55">
        <circle cx="16" cy="16" r="1.6"/>
        <circle cx="32" cy="16" r="1.6"/>
        <circle cx="48" cy="16" r="1.6"/>
        <circle cx="80" cy="16" r="1.6"/>
        <circle cx="96" cy="16" r="1.6"/>
        <circle cx="112" cy="16" r="1.6"/>
      </g>
      <line x1="20" y1="26" x2="20" y2="29" stroke="#0d1022" stroke-width="2"/>
      <line x1="64" y1="26" x2="64" y2="29" stroke="#0d1022" stroke-width="2"/>
      <line x1="108" y1="26" x2="108" y2="29" stroke="#0d1022" stroke-width="2"/>

      <!-- bodega de carga: contenedores apilados dentro de la amurada -->
      <g class="containers">
        <rect x="12" y="-14" width="14" height="18" rx="1" fill="#c0563f"/>
        <rect x="12" y="-14" width="14" height="3.5" fill="#e08268" opacity="0.7"/>
        <rect x="30" y="-14" width="14" height="18" rx="1" fill="#3f7f9c"/>
        <rect x="30" y="-14" width="14" height="3.5" fill="#6fa8c2" opacity="0.7"/>
        <rect x="48" y="-27" width="14" height="31" rx="1" fill="#dfae5a"/>
        <rect x="48" y="-27" width="14" height="3.5" fill="#f0cd8c" opacity="0.7"/>
        <rect x="66" y="-14" width="14" height="18" rx="1" fill="#b5765f"/>
        <rect x="66" y="-14" width="14" height="3.5" fill="#d6a08c" opacity="0.7"/>
        <rect x="84" y="-27" width="14" height="31" rx="1" fill="#3f7f9c"/>
        <rect x="84" y="-27" width="14" height="3.5" fill="#6fa8c2" opacity="0.7"/>
        <rect x="102" y="-14" width="14" height="18" rx="1" fill="#c0563f"/>
        <rect x="102" y="-14" width="14" height="3.5" fill="#e08268" opacity="0.7"/>
      </g>

      <!-- amurada: borda del buque que "encastra" los contenedores en la bodega -->
      <path d="M2,4 L2,-6 Q2,-8 4,-8 L116,-8 Q118,-8 118,-6 L118,4 Z"
            fill="none" stroke="url(#bulwarkShade)" stroke-width="9" stroke-linejoin="round"/>
      <path d="M4,-7.5 L116,-7.5" stroke="#4a5178" stroke-width="1" opacity="0.6"/>

      <!-- puente de mando (a popa) -->
      <g class="bridge">
        <rect x="-14" y="-30" width="15" height="34" rx="1.5" fill="#e9ddc8"/>
        <rect x="-12" y="-25" width="4" height="4" fill="#2a3350"/>
        <rect x="-6" y="-25" width="4" height="4" fill="#2a3350"/>
        <rect x="-12" y="-18" width="10" height="3" fill="#2a3350" opacity="0.5"/>
        <line x1="-7" y1="-30" x2="-7" y2="-42" stroke="#2a3350" stroke-width="1.4"/>
        <line x1="-7" y1="-42" x2="-1" y2="-42" stroke="#2a3350" stroke-width="1.4"/>
        <rect x="-19" y="-16" width="6" height="20" fill="#20263f"/>
      </g>

      <!-- chimenea con humo -->
      <g class="funnel">
        <path d="M-12,-16 L-11,-26 Q-11,-29 -7,-29 L-6,-29 Q-2,-29 -2,-26 L-1,-16 Z" fill="#2a3350"/>
        <rect x="-12" y="-27" width="10" height="2.4" fill="#c0563f"/>
        <path class="smoke smoke-1" d="M-7,-29 Q-3,-35 -7,-40 Q-11,-44 -7,-49" fill="none" stroke="#fdf3ea" stroke-width="2.4" stroke-linecap="round" opacity="0.28"/>
        <path class="smoke smoke-2" d="M-7,-29 Q-2,-34 -5,-39 Q-9,-43 -5,-47" fill="none" stroke="#fdf3ea" stroke-width="1.8" stroke-linecap="round" opacity="0.2"/>
      </g>
    </g>

    <!-- vegetación en primer plano -->
    <g class="foliage" fill="#141a2e">
      <path d="M-20,600 C10,520 40,560 60,600 Z"/>
      <path d="M40,600 C60,540 95,560 110,600 Z"/>
      <path d="M900,600 C930,530 960,560 985,600 Z"/>
      <path d="M840,600 C865,555 900,565 920,600 Z"/>
    </g>

    <!-- viñeta suave -->
    <rect x="0" y="0" width="1000" height="600" fill="url(#sunGlow)" opacity="0"/>
  </svg>

  <!-- partículas atmosféricas -->
  <div class="particles" id="particles"></div>

  <!-- ============ LETRA ============ -->
  <div class="lyrics-wrap">
    <svg class="lyrics-underline" viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true">
      <path id="lyricsInk" d="M10,10 Q200,4 390,10" fill="none" stroke="#ffe3b0" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p id="lyricLine" class="lyric-line" aria-live="polite"></p>
  </div>

  <!-- ============ CONTROLES ============ -->
  <div class="player" id="player">
    <div class="progress-row">
      <span class="time" id="timeCurrent">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-handle" id="progressHandle"></div>
      </div>
      <span class="time" id="timeTotal">0:00</span>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn loop-btn" id="loopBtn" title="Repetir" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M17 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11V9a4 4 0 0 1 4-4h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 22l-4-4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13v2a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="ctrl-btn play-btn" id="playBtn" title="Reproducir" aria-label="Reproducir">
        <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" width="22" height="22" style="display:none"><rect x="6" y="4.5" width="4.5" height="15" fill="currentColor"/><rect x="13.5" y="4.5" width="4.5" height="15" fill="currentColor"/></svg>
      </button>

      <div class="ctrl-spacer" aria-hidden="true"></div>
    </div>
  </div>

  <!-- ============ PANTALLA FINAL ============ -->
  <div class="final-screen" id="finalScreen">
    <div class="final-inner">
      <p class="final-question" id="finalQuestion">Ayudanos a mejorar</p>
      <div class="rating-row" id="ratingRow">
        <button class="rate-btn" data-rate="dislike" aria-label="No me gusta">
          <svg class="rate-icon-svg" viewBox="0 0 24 24" width="26" height="26" transform="rotate(180,0,0)">
            <path d="M7 22V10M2 13v7a2 2 0 0 0 2 2h13.5a2 2 0 0 0 2-1.6l1.4-7A2 2 0 0 0 19 11h-5.5l.9-4.5a1.77 1.77 0 0 0-3.4-1L9 10H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- <path d="M17 2v13M22 10.5v2a2 2 0 0 1-2 2h-3.5l.9 4.5a1.77 1.77 0 0 1-3.4 1L11 15H5.5a2 2 0 0 1-2-1.6l-1.4-7A2 2 0 0 1 4 4h13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/> -->
          </svg>
          <span>muy goma</span>
        </button>
        <button class="rate-btn" data-rate="like" aria-label="Me gusta">
          <svg class="rate-icon-svg" viewBox="0 0 24 24" width="26" height="26">
            <path d="M7 22V10M2 13v7a2 2 0 0 0 2 2h13.5a2 2 0 0 0 2-1.6l1.4-7A2 2 0 0 0 19 11h-5.5l.9-4.5a1.77 1.77 0 0 0-3.4-1L9 10H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>me gusta</span>
        </button>
        <button class="rate-btn" data-rate="love" aria-label="Me encanta">
          <svg class="rate-icon-svg" viewBox="0 0 24 24" width="26" height="26">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>me encanta</span>
        </button>
      </div>
      <p class="final-thanks" id="finalThanks">🫶</p>
      <button class="replay-btn" id="replayBtn">Volver a escuchar</button>
    </div>
  </div>

  <audio id="audio" src="audio/cancion.mp3" preload="metadata"></audio>
</div>

<script src="script.js"></script>
</body>
</html>
